#instruction sheet for our CI robot
name: CI Pipeline

on:
 push:

permissions:
  contents: read
  packages: write 

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: pip install fastapi pytest httpx

    - name: Run tests
      run: python -m pytest

    - name: log in to Github Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
         context: .
         push: true
         tags: ghcr.io/${{ github.repository_owner }}/taskmanagement-app:latest